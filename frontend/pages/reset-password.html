<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b91c1c">
  <meta name="description" content="Set a new password for RaktDal">
  <title>Reset Password | RaktDal</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="RaktDal home"><span class="brand-mark">R</span> RaktDal</a>
    <nav aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="../index.html#find-blood">Find Blood</a>
      <a href="../index.html#blood-banks">Blood Banks</a>
      <a href="../index.html#camps">Donation Camps</a>
    </nav>
    <div id="authNavContainer">
      <a class="button button-outline" href="login.html" style="padding:7px 14px; font-size:0.88rem;">Sign in</a>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-card">
      <div class="brand-mark" style="margin: 0 auto 16px;">R</div>
      <h2>Set New Password</h2>
      <p class="subtitle">Enter your reset token and choose a new, secure password.</p>
      <div id="resetMsg"></div>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="resetToken">Reset Token</label>
          <input type="text" id="resetToken" class="form-input" required placeholder="Paste token here" style="font-family: monospace; font-size: 0.85rem;">
        </div>

        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <div class="input-wrapper">
            <input type="password" id="newPassword" class="form-input" required minlength="8" placeholder="At least 8 characters">
            <button type="button" class="toggle-pwd-btn" id="toggleResetPwd">Show</button>
          </div>
          <div class="strength-bar"><div class="strength-progress" id="resetStrengthProgress"></div></div>
          <div class="strength-text" id="resetStrengthText">Password strength</div>
        </div>

        <button type="submit" id="resetSubmitBtn" class="button" style="width: 100%; margin-top: 10px;">
          <span>Update Password</span>
        </button>
      </form>

      <p style="margin-top: 22px; font-size: 0.88rem; color: var(--text-muted);">
        <a href="login.html" style="color: var(--text-muted);">← Back to Sign In</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">© <span id="year"></span> RaktDal · Built for responsible blood donation coordination</footer>

  <script type="module">
    import { api, updateNavAuth, setupPasswordToggle, evaluatePasswordStrength } from "../js/api.js";

    document.getElementById("year").textContent = new Date().getFullYear();
    updateNavAuth();

    setupPasswordToggle("newPassword", "toggleResetPwd");

    const params = new URLSearchParams(window.location.search);
    const urlToken = params.get("token");
    if (urlToken) {
      document.getElementById("resetToken").value = urlToken;
    }

    const pwdInput = document.getElementById("newPassword");
    const bar = document.getElementById("resetStrengthProgress");
    const text = document.getElementById("resetStrengthText");

    pwdInput.addEventListener("input", (e) => {
      const { score, label, color } = evaluatePasswordStrength(e.target.value);
      bar.style.width = `${score}%`;
      bar.style.backgroundColor = color;
      text.textContent = label ? `Password strength: ${label}` : "Password strength";
      text.style.color = color;
    });

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = document.getElementById("resetToken").value.trim();
      const newPassword = document.getElementById("newPassword").value;
      const msgEl = document.getElementById("resetMsg");
      const btn = document.getElementById("resetSubmitBtn");

      if (!token || !newPassword) {
        msgEl.innerHTML = `<div class="alert alert-error">Token and new password are required.</div>`;
        return;
      }
      if (newPassword.length < 8) {
        msgEl.innerHTML = `<div class="alert alert-error">Password must be at least 8 characters long.</div>`;
        return;
      }

      try {
        btn.disabled = true;
        btn.innerHTML = `<div class="btn-spinner"></div><span>Updating...</span>`;
        const res = await api.resetPassword({ token, newPassword });
        const data = await res.json();

        if (res.ok) {
          msgEl.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
          setTimeout(() => {
            window.location.href = "login.html?success=Password_reset_successful._Please_sign_in.";
          }, 2000);
        } else {
          msgEl.innerHTML = `<div class="alert alert-error">${data.message || "Password reset failed."}</div>`;
        }
      } catch (err) {
        msgEl.innerHTML = `<div class="alert alert-error">Network error. Please try again.</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Update Password</span>`;
      }
    });
  </script>
</body>
</html>
