<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b91c1c">
  <meta name="description" content="Register as a Blood Donor on RaktDal">
  <title>Register | RaktDal</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="RaktDal home"><span class="brand-mark">R</span> RaktDal</a>
    <nav aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="../index.html#find-blood">Find Blood</a>
      <a href="../index.html#blood-banks">Blood Banks</a>
      <a href="../index.html#camps">Donation Camps</a>
    </nav>
        <div id="authNavContainer">
      <div style="display:flex; align-items:center; gap:8px;">
        <a href="../index.html#/login" class="button button-outline" style="padding:7px 14px; font-size:0.88rem;">
          Sign In
        </a>
        <a href="../index.html#/register" class="button" style="padding:7px 14px; font-size:0.88rem;">
          Register
        </a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-card">
      <div class="brand-mark" style="margin: 0 auto 16px;">R</div>
      <h2>Join RaktDal</h2>
      <p class="subtitle">Create an account to connect with blood donation resources.</p>
      <div id="registerMsg"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="regFullName">Full Name</label>
          <input type="text" id="regFullName" class="form-input" required placeholder="Dr. Aarav Sharma">
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address</label>
          <input type="email" id="regEmail" class="form-input" required placeholder="aarav@example.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <div class="input-wrapper">
            <input type="password" id="regPassword" class="form-input" required minlength="8" placeholder="At least 8 characters">
            <button type="button" class="toggle-pwd-btn" id="toggleRegPwd">Show</button>
          </div>
          <div class="strength-bar"><div class="strength-progress" id="regStrengthProgress"></div></div>
          <div class="strength-text" id="regStrengthText">Password strength</div>
        </div>

        <button type="submit" id="regSubmitBtn" class="button" style="width: 100%; margin-top: 10px;">
          <span>Create Donor Account</span>
        </button>
      </form>

      <div class="divider"><hr><span>Or</span></div>

      <a id="googleLoginBtn" href="#" class="google-btn">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign up with Google</span>
      </a>

      <p style="margin-top: 22px; font-size: 0.88rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--red); font-weight: 600;">Sign in</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">© <span id="year"></span> RaktDal · Built for responsible blood donation coordination</footer>

  <script type="module">
    import { api, updateNavAuth, setupPasswordToggle, evaluatePasswordStrength } from "../js/api.js";

    document.getElementById("year").textContent = new Date().getFullYear();
    document.getElementById("googleLoginBtn").href = `${api.getBaseUrl()}/auth/google`;

    updateNavAuth().then(user => {
      if (user) window.location.href = "profile.html";
    });

    setupPasswordToggle("regPassword", "toggleRegPwd");

    const pwdInput = document.getElementById("regPassword");
    const bar = document.getElementById("regStrengthProgress");
    const text = document.getElementById("regStrengthText");

    pwdInput.addEventListener("input", (e) => {
      const { score, label, color } = evaluatePasswordStrength(e.target.value);
      bar.style.width = `${score}%`;
      bar.style.backgroundColor = color;
      text.textContent = label ? `Password strength: ${label}` : "Password strength";
      text.style.color = color;
    });

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fullName = document.getElementById("regFullName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const msgEl = document.getElementById("registerMsg");
      const btn = document.getElementById("regSubmitBtn");

      if (!fullName || !email || !password) {
        msgEl.innerHTML = `<div class="alert alert-error">Please fill in all required fields.</div>`;
        return;
      }
      if (password.length < 8) {
        msgEl.innerHTML = `<div class="alert alert-error">Password must be at least 8 characters long.</div>`;
        return;
      }

      try {
        btn.disabled = true;
        btn.innerHTML = `<div class="btn-spinner"></div><span>Creating account...</span>`;
        const res = await api.register({ fullName, email, password });
        const data = await res.json();

        if (res.ok) {
          msgEl.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
          setTimeout(() => {
            window.location.href = `verify-email.html?email=${encodeURIComponent(email)}`;
          }, 1500);
        } else {
          msgEl.innerHTML = `<div class="alert alert-error">${data.message || "Registration failed."}</div>`;
        }
      } catch (err) {
        msgEl.innerHTML = `<div class="alert alert-error">Network error. Please try again later.</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Create Donor Account</span>`;
      }
    });
  </script>
</body>
</html>
