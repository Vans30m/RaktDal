<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b91c1c">
  <meta name="description" content="Reset your RaktDal password">
  <title>Forgot Password | RaktDal</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="RaktDal home"><span class="brand-mark">R</span> RaktDal</a>
    <nav aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="../index.html#find-blood">Find Blood</a>
      <a href="../index.html#blood-banks">Blood Banks</a>
      <a href="../index.html#camps">Donation Camps</a>
    </nav>
        <div id="authNavContainer">
      <div style="display:flex; align-items:center; gap:8px;">
        <a href="../index.html#/login" class="button button-outline" style="padding:7px 14px; font-size:0.88rem;">
          Sign In
        </a>
        <a href="../index.html#/register" class="button" style="padding:7px 14px; font-size:0.88rem;">
          Register
        </a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-card">
      <div class="brand-mark" style="margin: 0 auto 16px;">R</div>
      <h2>Reset Password</h2>
      <p class="subtitle">Enter your registered email address and we'll send reset instructions.</p>
      <div id="forgotMsg"></div>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="forgotEmail">Email Address</label>
          <input type="email" id="forgotEmail" class="form-input" required placeholder="you@example.com">
        </div>

        <button type="submit" id="forgotSubmitBtn" class="button" style="width: 100%; margin-top: 10px;">
          <span>Send Password Reset Link</span>
        </button>
      </form>

      <p style="margin-top: 22px; font-size: 0.88rem; color: var(--text-muted);">
        Remember your password? <a href="login.html" style="color: var(--red); font-weight: 600;">Sign in</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">© <span id="year"></span> RaktDal · Built for responsible blood donation coordination</footer>

  <script type="module">
    import { api, updateNavAuth } from "../js/api.js";

    document.getElementById("year").textContent = new Date().getFullYear();
    updateNavAuth();

    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("forgotEmail").value.trim();
      const msgEl = document.getElementById("forgotMsg");
      const btn = document.getElementById("forgotSubmitBtn");

      if (!email) {
        msgEl.innerHTML = `<div class="alert alert-error">Please enter your registered email.</div>`;
        return;
      }

      try {
        btn.disabled = true;
        btn.innerHTML = `<div class="btn-spinner"></div><span>Sending...</span>`;
        const res = await api.forgotPassword({ email });
        const data = await res.json();
        msgEl.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
      } catch (err) {
        msgEl.innerHTML = `<div class="alert alert-error">Request failed. Please try again later.</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Send Password Reset Link</span>`;
      }
    });
  </script>
</body>
</html>
