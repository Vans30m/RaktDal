<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b91c1c">
  <meta name="description" content="Sign In to RaktDal">
  <title>Sign In | RaktDal</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="RaktDal home"><span class="brand-mark">R</span> RaktDal</a>
    <nav aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="../index.html#find-blood">Find Blood</a>
      <a href="../index.html#blood-banks">Blood Banks</a>
      <a href="../index.html#camps">Donation Camps</a>
    </nav>
    <div id="authNavContainer">
      <a class="button" href="register.html" style="padding:7px 14px; font-size:0.88rem;">Register</a>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-card">
      <div class="brand-mark" style="margin: 0 auto 16px;">R</div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to your RaktDal donor account.</p>
      <div id="loginMsg"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" required placeholder="you@example.com">
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label class="form-label" for="loginPassword" style="margin:0;">Password</label>
            <a href="forgot-password.html" style="font-size:0.8rem; color:var(--red); font-weight:500;">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <input type="password" id="loginPassword" class="form-input" required placeholder="••••••••">
            <button type="button" class="toggle-pwd-btn" id="toggleLoginPwd">Show</button>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="button" style="width: 100%; margin-top: 10px;">
          <span>Sign In</span>
        </button>
      </form>

      <div class="divider"><hr><span>Or</span></div>

      <a id="googleLoginBtn" href="#" class="google-btn">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </a>

      <p style="margin-top: 22px; font-size: 0.88rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--red); font-weight: 600;">Register</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">© <span id="year"></span> RaktDal · Built for responsible blood donation coordination</footer>

  <script type="module">
    import { api, updateNavAuth, setupPasswordToggle } from "../js/api.js";

    document.getElementById("year").textContent = new Date().getFullYear();
    document.getElementById("googleLoginBtn").href = `${api.getBaseUrl()}/auth/google`;

    updateNavAuth().then(user => {
      if (user) window.location.href = "profile.html";
    });

    setupPasswordToggle("loginPassword", "toggleLoginPwd");

    const params = new URLSearchParams(window.location.search);
    const errorParam = params.get("error");
    const successParam = params.get("success");
    const msgEl = document.getElementById("loginMsg");

    if (errorParam) {
      msgEl.innerHTML = `<div class="alert alert-error">${errorParam.replace(/_/g, " ")}</div>`;
    } else if (successParam) {
      msgEl.innerHTML = `<div class="alert alert-success">${successParam.replace(/_/g, " ")}</div>`;
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const btn = document.getElementById("loginSubmitBtn");

      if (!email || !password) {
        msgEl.innerHTML = `<div class="alert alert-error">Please enter both email and password.</div>`;
        return;
      }

      try {
        btn.disabled = true;
        btn.innerHTML = `<div class="btn-spinner"></div><span>Signing in...</span>`;
        const res = await api.login({ email, password });
        const data = await res.json();

        if (res.ok) {
          window.location.href = "profile.html";
        } else {
          if (data.error?.code === "EMAIL_NOT_VERIFIED") {
            msgEl.innerHTML = `
              <div class="alert alert-warning">
                ${data.message}
                <div style="margin-top: 8px;">
                  <a href="verify-email.html?email=${encodeURIComponent(email)}" style="font-weight: 700; text-decoration: underline;">
                    Verify Email Now →
                  </a>
                </div>
              </div>
            `;
          } else {
            msgEl.innerHTML = `<div class="alert alert-error">${data.message || "Invalid credentials."}</div>`;
          }
        }
      } catch (err) {
        msgEl.innerHTML = `<div class="alert alert-error">Network connection issue. Please retry.</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In</span>`;
      }
    });
  </script>
</body>
</html>
