<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b91c1c">
  <link rel="shortcut icon" href="assets/logo-removebg.png" type="image/x-icon">
  <meta name="description" content="RaktDal - Blood Donation and Donor Coordination Platform">
  <title>RaktDal | Blood Donation & Donor Coordination</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="site-header" id="siteHeader">
    <a class="brand" href="#/" aria-label="RaktDal home"><img src="assets/logo-removebg.png" style="height: 40px;"> RaktDal</a>
    
    <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle navigation menu" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <nav id="mainNav" aria-label="Main navigation">
      <a href="#/" data-route="/">Home</a>
      <a href="#/find-blood" data-route="/find-blood">Find Donors</a>
      <a href="#/donor/register" data-route="/donor/register">Donate Blood</a>
      <a href="#/requests" data-route="/requests">Blood Requests</a>
      <a href="#/camps" data-route="/camps">Donation Camps</a>
    </nav>

    <div id="authNavContainer">
      <div style="display:flex; align-items:center; gap:8px;">
        <a href="#/login" class="button button-outline" style="padding:7px 14px; font-size:0.88rem;">
          Sign In
        </a>
        <a href="#/register" class="button" style="padding:7px 14px; font-size:0.88rem;">
          Register
        </a>
      </div>
    </div>
  </header>
  
  <main id="app" class="main-content" aria-live="polite"><!-- Dynamic SPA Views -->
  </main>
  
  <footer class="site-footer" id="defaultSiteFooter" style="display:none;">
    © <span id="year">2026</span> RaktDal · Built for responsible blood donation coordination
  </footer>
  
  <script type="module" src="./js/app.js"></script>
</body>
</html>
